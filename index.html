<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>직원관리시스템</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script data-select-to-edit="5">
(function() {
  var active = false;
  var hoverOverlay = null;
  var selectedOverlay = null;
  var badge = null;
  var lastTarget = null;
  var selectedTarget = null;
  function createHoverOverlay() {
    var el = document.createElement('div');
    el.id = '__ste_hover_overlay';
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:999999;border:1px solid #3183F6;background-color:rgba(49,131,246,0.10);border-radius:4px;transition:all 0.1s ease;display:none;';
    document.body.appendChild(el);
    return el;
  }
  function createSelectedOverlay() {
    var el = document.createElement('div');
    el.id = '__ste_selected_overlay';
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:999998;border:2px solid #3183F6;border-radius:4px;display:none;';
    document.body.appendChild(el);
    return el;
  }
  function createBadge() {
    var el = document.createElement('div');
    el.id = '__ste_badge';
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:1000000;background:#3183F6;color:#fff;font:500 11px/1 system-ui,-apple-system,sans-serif;padding:4px 8px;border-radius:9999px;white-space:nowrap;display:none;';
    document.body.appendChild(el);
    return el;
  }
  function buildSelector(el) {
    var parts = [];
    var cur = el;
    while (cur && cur !== document.body && cur !== document.documentElement) {
      var sel = cur.tagName.toLowerCase();
      if (cur.id) { sel += '#' + cur.id; parts.unshift(sel); break; }
      var parent = cur.parentElement;
      if (parent) {
        var siblings = Array.from(parent.children).filter(function(c) { return c.tagName === cur.tagName; });
        if (siblings.length > 1) { sel += ':nth-of-type(' + (siblings.indexOf(cur) + 1) + ')'; }
      }
      parts.unshift(sel);
      cur = parent;
    }
    return parts.join(' > ');
  }
  function positionOverlay(el, target) {
    var rect = target.getBoundingClientRect();
    el.style.display = 'block';
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.style.width = rect.width + 'px';
    el.style.height = rect.height + 'px';
  }
  function positionBadge(target) {
    if (!badge) badge = createBadge();
    var rect = target.getBoundingClientRect();
    badge.textContent = '# ' + target.tagName.toLowerCase();
    badge.style.display = 'block';
    var above = rect.top - 24;
    badge.style.left = rect.left + 'px';
    badge.style.top = (above < 0 ? rect.top + 4 : above) + 'px';
  }
  function isBackground(el) {
    return el === document.body || el === document.documentElement;
  }
  function onMouseMove(e) {
    if (!active) return;
    var target = e.target;
    if (target === hoverOverlay || target === selectedOverlay || target.dataset.selectToEdit) return;
    lastTarget = target;
    if (!hoverOverlay) hoverOverlay = createHoverOverlay();
    if (target === selectedTarget || isBackground(target)) {
      hoverOverlay.style.display = 'none';
    } else {
      positionOverlay(hoverOverlay, target);
    }
    if (selectedTarget) return;
    if (isBackground(target)) {
      if (badge) badge.style.display = 'none';
    } else {
      positionBadge(target);
    }
  }
  function onClick(e) {
    if (!active) return;
    e.preventDefault();
    e.stopPropagation();
    var target = lastTarget || e.target;
    if (target === hoverOverlay || target === selectedOverlay) return;
    if (isBackground(target)) return;
    selectedTarget = target;
    if (!selectedOverlay) selectedOverlay = createSelectedOverlay();
    positionOverlay(selectedOverlay, target);
    positionBadge(target);
    if (hoverOverlay) hoverOverlay.style.display = 'none';
    var text = (target.textContent || '').trim().slice(0, 100);
    window.parent.postMessage({
      type: 'genbuilder:element-selected',
      payload: {
        tag: target.tagName.toLowerCase(),
        text: text,
        className: target.className || '',
        cssSelector: buildSelector(target)
      }
    }, '*');
  }
  function onKeyDown(e) {
    if (!active) return;
    if (e.key !== 'Escape') return;
    window.parent.postMessage({ type: 'genbuilder:select-escape' }, '*');
  }
  function repositionSelected() {
    if (!selectedTarget) return;
    if (selectedOverlay) positionOverlay(selectedOverlay, selectedTarget);
    positionBadge(selectedTarget);
  }
  function clearSelection() {
    selectedTarget = null;
    if (selectedOverlay) selectedOverlay.style.display = 'none';
    if (badge) badge.style.display = 'none';
  }
  function activate() {
    active = true;
    document.body.style.cursor = 'crosshair';
    if (!hoverOverlay) hoverOverlay = createHoverOverlay();
  }
  function deactivate() {
    active = false;
    document.body.style.cursor = '';
    if (hoverOverlay) hoverOverlay.style.display = 'none';
    if (selectedOverlay) selectedOverlay.style.display = 'none';
    if (badge) badge.style.display = 'none';
    lastTarget = null;
    selectedTarget = null;
  }
  document.addEventListener('mousemove', onMouseMove, true);
  document.addEventListener('click', onClick, true);
  document.addEventListener('keydown', onKeyDown, true);
  window.addEventListener('scroll', repositionSelected, true);
  window.addEventListener('resize', repositionSelected);
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'genbuilder:set-select') {
      if (e.data.active) activate(); else deactivate();
    } else if (e.data.type === 'genbuilder:clear-selection') {
      clearSelection();
    }
  });
})();
</script></body>
</html>
