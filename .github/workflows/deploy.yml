name: Deploy to GCP (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      # 젠빌더가 이 배포를 가려내는 열쇠 (#29947). 사람이 GitHub 에서 직접 돌리면 비어 있다.
      # run-name 으로 실행 제목에 새겨야 완료 웹훅까지 따라온다 — 입력값 자체는 웹훅에 실리지 않는다.
      genbuilder_run_ref:
        description: "GenBuilder deploy reference (leave empty for manual runs)"
        required: false
        default: ""

# 제목 전체가 젠빌더의 열쇠가 되게 한다 (#29947) — 앞에 다른 글자가 붙으면 동등 비교를
# 못 쓴다. 사람이 GitHub 에서 직접 돌리면 입력이 비어 있어 워크플로 이름으로 떨어진다.
run-name: ${{ inputs.genbuilder_run_ref || github.workflow }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push image
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/app:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # 젠빌더 배포 이력(#29036)이 읽는 자리다. stderr 를 파일로 받아 실패 사유를,
      # 성공하면 서비스 주소를 애너테이션으로 내보낸다. 이 두 줄의 title 로 구분하므로
      # 고치면 배포 이력의 「실패 사유」·「대상 ›」 이 비어 보인다.
      - name: Deploy to Cloud Run
        id: deploy
        env:
          REGION: ${{ secrets.GCP_REGION }}
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/app:${{ github.sha }}
        run: |
          set -o pipefail
          gcloud run deploy app \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --format='value(status.url)' 2> >(tee /tmp/genbuilder-deploy.err >&2) | tee /tmp/genbuilder-deploy.out

      - name: Report service URL
        if: success()
        run: |
          # 파일이 없으면 tail 이 비정상 종료해 `-e` 로 스텝이 끝난다 — 성공한 배포가
          # 실패로 뒤집힌다.
          URL="$(tail -n 1 /tmp/genbuilder-deploy.out 2>/dev/null | tr -d '\r' || true)"
          [ -n "$URL" ] && echo "::notice title=GENBUILDER_SERVICE_URL::$URL"
          exit 0

      - name: Report failure reason
        if: failure()
        run: |
          # Actions 기본 bash 는 `-e -o pipefail` 이다. 파일이 없으면 tail 이 비정상 종료해
          # 이 줄에서 스텝이 끝나고 아래 애너테이션이 나가지 않는다 — 실패 사유가 통째로 빈다.
          REASON="$(tail -c 2000 /tmp/genbuilder-deploy.err 2>/dev/null | tr '\n' ' ' || true)"
          [ -z "$REASON" ] && REASON="배포 단계가 실패했습니다. GitHub 실행 로그를 확인해 주세요."
          # 오류 코드는 gcloud 가 대문자 스네이크로 뱉는 것만 집는다 — 없으면 비운다.
          # 대문자 코드가 없는 실패가 더 흔하다. grep 이 1 을 돌려주면 여기서 스텝이 끝나므로
          # 무매치를 빈 코드로 넘긴다.
          CODE="$(printf '%s' "$REASON" | grep -oE '[A-Z][A-Z_]{4,}' | head -n 1 || true)"
          echo "::error title=GENBUILDER_DEPLOY_ERROR ${CODE}::${REASON}"
