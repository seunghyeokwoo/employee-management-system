name: Deploy to VPS (SSH)

on:
  workflow_dispatch:
    inputs:
      # 젠빌더가 이 배포를 가려내는 열쇠 (#29947). 사람이 GitHub 에서 직접 돌리면 비어 있다.
      # run-name 으로 실행 제목에 새겨야 완료 웹훅까지 따라온다 — 입력값 자체는 웹훅에 실리지 않는다.
      genbuilder_run_ref:
        description: "GenBuilder deploy reference (leave empty for manual runs)"
        required: false
        default: ""

# 제목 전체가 젠빌더의 열쇠가 되게 한다 (#29947) — 앞에 다른 글자가 붙으면 동등 비교를
# 못 쓴다. 사람이 GitHub 에서 직접 돌리면 입력이 비어 있어 워크플로 이름으로 떨어진다.
run-name: ${{ inputs.genbuilder_run_ref || github.workflow }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY }}/${{ github.repository }}:${{ github.sha }}

      # ssh-action 은 원격에서 돌아 stderr 를 우리 러너 파일로 받을 수 없다.
      # 그래서 이 템플릿만 구조화 출력이 없고, 배포 이력은 실패 step 이름으로 폴백한다(#29036).
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            echo "REGISTRY=${{ secrets.REGISTRY }}" > .env
            echo "IMAGE_NAME=${{ github.repository }}" >> .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            docker login ${{ secrets.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker compose pull
            docker compose up -d
