name: Deploy to Kubernetes

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY }}/${{ github.repository }}:${{ github.sha }}

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply manifests
        run: |
          perl -i -pe "s|REGISTRY_IMAGE_PLACEHOLDER|${{ secrets.REGISTRY }}/${{ github.repository }}:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/
          # Wait for deployment availability via polling (not watch) — watch streams
          # don't survive HTTP-mode reverse proxies (cloudflared / nginx-proxy 등) 의
          # idle-close 라, kubectl rollout status / kubectl wait 가 hang 한다.
          # 같은 timeout(180s) 을 5s × 36회로 분할.
          for i in $(seq 1 36); do
            ready=$(kubectl get deployment/app -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo 0)
            desired=$(kubectl get deployment/app -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 1)
            if [ -n "$ready" ] && [ "$ready" = "$desired" ]; then
              echo "Rollout succeeded: $ready/$desired available"
              exit 0
            fi
            echo "Waiting for rollout... ${ready:-0}/$desired available (attempt $i/36)"
            sleep 5
          done
          echo "ERROR: Rollout did not complete within 180s"
          kubectl get deployment/app -o wide || true
          kubectl describe deployment/app | tail -30 || true
          exit 1
