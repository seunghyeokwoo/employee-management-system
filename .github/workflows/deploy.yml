name: Deploy to AWS (ECR + ECS)

on:
  workflow_dispatch:
    inputs:
      # 젠빌더가 이 배포를 가려내는 열쇠 (#29947). 사람이 GitHub 에서 직접 돌리면 비어 있다.
      # run-name 으로 실행 제목에 새겨야 완료 웹훅까지 따라온다 — 입력값 자체는 웹훅에 실리지 않는다.
      genbuilder_run_ref:
        description: "GenBuilder deploy reference (leave empty for manual runs)"
        required: false
        default: ""

# 제목 전체가 젠빌더의 열쇠가 되게 한다 (#29947) — 앞에 다른 글자가 붙으면 동등 비교를
# 못 쓴다. 사람이 GitHub 에서 직접 돌리면 입력이 비어 있어 워크플로 이름으로 떨어진다.
run-name: ${{ inputs.genbuilder_run_ref || github.workflow }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ secrets.AWS_ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPO:$TAG .
          docker push $REGISTRY/$REPO:$TAG

      # 서비스가 쓰는 Task Definition 의 이미지만 이번 태그로 바꿔 새 리비전을 등록한다.
      # --force-new-deployment 만 부르면 ECS 는 기존 리비전을 그대로 다시 띄우므로, 방금 올린
      # 이미지는 ECR 에 쌓이기만 하고 배포는 성공으로 표시된다 (#21746).
      - name: Register new task definition with the built image
        id: taskdef
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ secrets.AWS_ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
          CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
          SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
        run: |
          set -euo pipefail
          current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          # 등록에 쓸 수 없는 읽기 전용 필드는 덜어낸다.
          aws ecs describe-task-definition --task-definition "$current" \
            --query 'taskDefinition' --output json \
            | jq --arg image "$REGISTRY/$REPO:$TAG" \
                '.containerDefinitions[0].image = $image
                 | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                       .compatibilities, .registeredAt, .registeredBy)' > taskdef.json
          arn=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # 젠빌더 배포 이력(#29036)이 읽는 자리다. 아래 두 step 의 title 로 값을 찾으므로
      # 고치면 배포 이력의 「실패 사유」·「대상 ›」 이 비어 보인다.
      - name: Update ECS service
        id: deploy
        env:
          CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
          SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
          TASKDEF: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -o pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$TASKDEF" --force-new-deployment 2> >(tee /tmp/genbuilder-deploy.err >&2) > /dev/null

      # ECS 는 서비스 주소를 배포 명령이 돌려주지 않는다(로드밸런서에 달린다).
      # 주소를 알 수 없으면 애너테이션을 내보내지 않고, 이력의 「대상」 은 플랫폼 이름만 보여 준다.

      - name: Report failure reason
        if: failure()
        run: |
          # Actions 기본 bash 는 `-e -o pipefail` 이다. 파일이 없으면 tail 이 비정상 종료해
          # 이 줄에서 스텝이 끝나고 아래 애너테이션이 나가지 않는다 — 실패 사유가 통째로 빈다.
          REASON="$(tail -c 2000 /tmp/genbuilder-deploy.err 2>/dev/null | tr '\n' ' ' || true)"
          [ -z "$REASON" ] && REASON="배포 단계가 실패했습니다. GitHub 실행 로그를 확인해 주세요."
          # 대문자 코드가 없는 실패가 더 흔하다. grep 이 1 을 돌려주면 여기서 스텝이 끝나므로
          # 무매치를 빈 코드로 넘긴다.
          CODE="$(printf '%s' "$REASON" | grep -oE '[A-Z][A-Z_]{4,}' | head -n 1 || true)"
          echo "::error title=GENBUILDER_DEPLOY_ERROR ${CODE}::${REASON}"
